# Runs Unity EditMode and PlayMode tests on every pull request (and on main).
#
# Required repository secrets (Settings > Secrets and variables > Actions). Never commit these values.
#   UNITY_LICENSE   Full contents of the activated Unity license file (.ulf). Personal or Pro.
#   UNITY_EMAIL     Email of the Unity account that owns the license.
#   UNITY_PASSWORD  Password of that Unity account.
# How to obtain the .ulf: follow the GameCI "Activation" guide (game.ci/docs/github/activation).
# Pro/Plus serial-based activation can use UNITY_SERIAL instead of UNITY_LICENSE.
#
# The Unity version is read from UnityProject/ProjectSettings/ProjectVersion.txt.

name: Unity tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Tests (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]

    steps:
      - name: Check Unity secrets are configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See the header of .github/workflows/test.yml."
            exit 1
          fi

      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('UnityProject/Packages/manifest.json', 'UnityProject/Packages/packages-lock.json', 'UnityProject/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('UnityProject/Assets/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-${{ hashFiles('UnityProject/Packages/manifest.json', 'UnityProject/Packages/packages-lock.json', 'UnityProject/ProjectSettings/ProjectVersion.txt') }}-
            Library-${{ matrix.testMode }}-

      - name: Run ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results (${{ matrix.testMode }})

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
